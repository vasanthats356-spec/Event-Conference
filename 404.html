<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Event Conference - 404 Page Not Found</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <!-- AOS — Animate On Scroll -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />

  <style>
    :root {
      --conf-night:      #0F0A28;   /* page background        */
      --conf-deep:       #1A1046;   /* card / panel base      */
      --conf-mid:        #2B1B6B;   /* gradient stop          */
      --conf-violet:     #7C3AED;   /* glow / accents         */
      --conf-violet-soft:#A78BFA;   /* secondary accent       */
      --conf-gold:       #FFC93C;   /* primary accent (CTA)   */
      --conf-gold-deep:  #F0A500;   /* CTA gradient end       */
      --conf-text:       #F1ECFF;   /* main text              */
      --conf-muted:      #B9A9E8;   /* muted text             */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
    }

    html, body { overflow-x: hidden; }

    body {
      background: var(--conf-night);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      color: var(--conf-text);
    }

    /* Soft event-style background accents */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 440px; height: 440px;
      background: #7C3AED;
      top: -140px; left: -140px;
    }
    body::after {
      width: 480px; height: 480px;
      background: #FFC93C;
      bottom: -180px; right: -180px;
      opacity: 0.22;
    }

    /* ===== CENTERED TICKET-STYLE CARD ===== */
    .error-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      background:
        linear-gradient(160deg, rgba(43, 27, 107, 0.96), rgba(15, 10, 40, 0.98));
      border-radius: 30px;
      border: 1.5px solid rgba(255, 201, 60, 0.45);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(167, 139, 250, 0.1) inset;
      overflow: hidden;
      padding: 70px 50px 60px;
      text-align: center;
    }

    /* Decorative ticket perforation top */
    .error-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 7px;
      background: linear-gradient(90deg, var(--conf-gold), #FFE9A3, var(--conf-gold));
    }

    /* Large watermark 404 behind content */
    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -10px;
      color: rgba(255, 201, 60, 0.05);
      pointer-events: none;
      z-index: 0;
      user-select: none;
      white-space: nowrap;
    }

    .error-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== ILLUSTRATION / ICON ===== */
    .error-visual {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 201, 60, 0.08);
      border: 1.5px solid rgba(255, 201, 60, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      box-shadow: 0 0 50px rgba(124, 58, 237, 0.35);
    }

    .error-visual img {
      width: 86px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45));
      animation: floatY 4.5s ease-in-out infinite;
    }

    .error-visual .fallback-icon {
      font-size: 3.4rem;
      color: var(--conf-gold);
      display: none;
      animation: floatY 4.5s ease-in-out infinite;
      filter: drop-shadow(0 8px 20px rgba(255, 201, 60, 0.35));
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    /* ===== BADGE ===== */
    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: rgba(255, 201, 60, 0.1);
      color: var(--conf-gold);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 60px;
      border: 1px solid rgba(255, 201, 60, 0.45);
      margin-bottom: 20px;
    }
    .error-badge i { color: var(--conf-gold); font-size: 0.85rem; }

    /* ===== 404 CODE ===== */
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
      margin-bottom: 10px;
      background: linear-gradient(120deg, var(--conf-gold), #FFE9A3, var(--conf-gold-deep));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 6px 24px rgba(255, 201, 60, 0.25));
    }

    .error-title {
      font-size: 1.65rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    .error-text {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--conf-muted);
      margin-bottom: 34px;
      max-width: 500px;
    }
    .error-text .highlight {
      color: var(--conf-gold);
      font-weight: 700;
      background: linear-gradient(180deg, transparent 62%, rgba(255, 201, 60, 0.22) 62%);
      padding: 0 3px;
      border-radius: 2px;
    }

    /* ===== DIVIDER ===== */
    .ticket-divider {
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 30px;
      color: rgba(255, 201, 60, 0.55);
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .ticket-divider::before,
    .ticket-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 201, 60, 0.5), transparent);
    }

    /* ===== BUTTONS ===== */
    .error-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      border: 1.5px solid transparent;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--conf-gold), var(--conf-gold-deep));
      color: #1A1046;
      box-shadow: 0 10px 28px rgba(255, 201, 60, 0.3);
    }
    .btn-primary i { color: #1A1046; }
    .btn-primary:hover {
      background: linear-gradient(135deg, #FFD766, var(--conf-gold));
      transform: translateY(-3px);
      box-shadow: 0 14px 34px rgba(255, 201, 60, 0.45);
    }

    .btn-secondary {
      background: transparent;
      border-color: rgba(167, 139, 250, 0.6);
      color: var(--conf-text);
    }
    .btn-secondary i { color: var(--conf-violet-soft); }
    .btn-secondary:hover {
      background: rgba(124, 58, 237, 0.22);
      border-color: var(--conf-violet-soft);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.25);
    }
    .btn-secondary:hover i { color: var(--conf-violet-soft); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .error-card { padding: 56px 34px 50px; border-radius: 24px; }
      .watermark { font-size: 12rem; letter-spacing: -6px; }
      .error-code { font-size: 4rem; }
      .error-title { font-size: 1.4rem; }
    }

    @media (max-width: 480px) {
      body { padding: 24px 16px; }
      .error-card { padding: 44px 22px 40px; border-radius: 20px; }
      .watermark { font-size: 8.5rem; letter-spacing: -4px; }
      .error-visual { width: 104px; height: 104px; margin-bottom: 22px; }
      .error-visual img { width: 68px; }
      .error-visual .fallback-icon { font-size: 2.6rem; }
      .error-code { font-size: 3.2rem; }
      .error-title { font-size: 1.2rem; }
      .error-text { font-size: 0.92rem; margin-bottom: 28px; }
      .ticket-divider { margin-bottom: 24px; }
      .error-actions { width: 100%; flex-direction: column; }
      .btn { width: 100%; padding: 0.9rem 1.4rem; }
    }
  </style>
</head>
<body>

  <div class="error-card">

    <!-- Huge watermark 404 -->
    <div class="watermark" aria-hidden="true">404</div>

    <div class="error-inner">

      <!-- ===== VISUAL / ICON ===== -->
      <div class="error-visual"
           data-aos="zoom-in"
           data-aos-duration="900">
        <img
          src="ec5.webp"
          alt="Page not found illustration"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
        />
        <i class="fa-solid fa-ticket fallback-icon"></i>
      </div>

      <!-- ===== BADGE ===== -->
      <span class="error-badge"
            data-aos="fade-down"
            data-aos-delay="100">
        <i class="fa-solid fa-triangle-exclamation"></i>
        Error 404
      </span>

      <!-- ===== 404 CODE ===== -->
      <h1 class="error-code"
          data-aos="zoom-in"
          data-aos-delay="200">
        404
      </h1>

      <!-- ===== TITLE ===== -->
      <h2 class="error-title"
          data-aos="fade-up"
          data-aos-delay="300">
        This page isn’t in the program.
      </h2>

      <!-- ===== TEXT ===== -->
      <p class="error-text"
         data-aos="fade-up"
         data-aos-delay="400">
        The page you’re looking for has <span class="highlight">left the venue</span>
        or moved to a new session. Let’s get you back to the main stage.
      </p>

      <!-- ===== DECORATIVE DIVIDER ===== -->
      <div class="ticket-divider"
           data-aos="fade-up"
           data-aos-delay="450">
        Event Conference
      </div>

      <!-- ===== ACTIONS ===== -->
      <div class="error-actions"
           data-aos="fade-up"
           data-aos-delay="500">
        <a href="index.html" class="btn btn-primary">
          <i class="fa-solid fa-house"></i> Back to Home
        </a>
        <a href="javascript:void(0)" class="btn btn-secondary" onclick="history.back()">
          <i class="fa-solid fa-arrow-left"></i> Go Back
        </a>
      </div>

    </div>

  </div>

  <!-- AOS JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
    AOS.init({
      duration: 800,
      easing: 'ease-out-cubic',
      once: true,
      offset: 60,
      mirror: false
    });
  </script>

</body>
</html>
